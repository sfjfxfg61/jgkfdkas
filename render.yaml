services:
  - type: web
    name: victoria-simple-bot
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PRIVATE_CHANNEL_URL
        sync: false
      - key: FOLLOWUPS_ENABLED
        value: 'true'
