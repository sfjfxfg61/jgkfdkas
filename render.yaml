services:
  - type: web
    name: victoria-personal-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: COMPANION_NAME
        value: Vika
      - key: FOLLOWUPS_ENABLED
        value: true
      - key: MARKETING_MODE
        value: limited
      - key: PRIVATE_CHANNEL_URL
        sync: false
      - key: PUB_LINK_UK
        sync: false
      - key: PUB_LINK_RU
        sync: false
      - key: PUB_LINK_EN
        sync: false
      - key: PUB_LINK_ES
        sync: false
      - key: PUB_LINK_DE
        sync: false
      - key: PUB_LINK_FR
        sync: false
